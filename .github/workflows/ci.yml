# Phase 0 CI (spec 001). Each job is a requirement of docs/spec.md §10 "CI per phase".
name: ci

# s001_t10_r10_triggers_and_permissions: push to main/mvp, every PR, read-only.
# A label added or removed reruns it too, since adr-guard reads the labels of the event, and
# so does `edited`, which a change of base branch fires.
on:
  push:
    branches: [main, mvp]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  # s001_t05_r05_concurrency_cancels_previous_runs: one run per branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# `bash` named explicitly runs every step with `-eo pipefail`: a failing command
# inside a pipe fails its step instead of being hidden by the last one.
defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # from rust-toolchain.toml (rustup ≥ 1.28 installs the pinned channel and components)
      - name: s001_t01_r01_fmt_check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # from rust-toolchain.toml (rustup ≥ 1.28 installs the pinned channel and components)
      - uses: Swatinem/rust-cache@v2 # s001_t06_r06_cargo_cache
      - name: s001_t02_r02_clippy_denies_warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: s016_t12_r12_clippy_under_cfg_fuzzing
        # `fuzz_entry` compiles only under `--cfg fuzzing` outside tests (spec 016).
        run: RUSTFLAGS="--cfg fuzzing" cargo clippy -p privatechat-core -- -D warnings
      - name: s010_t26_r17_clippy_paths_resolve
        # A `disallowed-methods` path clippy cannot resolve guards nothing, and clippy only
        # warns of it even under -D warnings; `touch` makes it lint `core` again.
        run: |
          touch crates/core/src/lib.rs
          out="$(cargo clippy -p privatechat-core -- -D warnings 2>&1)"
          if printf '%s\n' "$out" | grep 'does not refer to'; then exit 1; fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # from rust-toolchain.toml (rustup ≥ 1.28 installs the pinned channel and components)
      - uses: Swatinem/rust-cache@v2
      - name: s000_t01_r01_workspace_builds
        run: cargo build --workspace --all-targets
      - name: s000_t02_r02_workspace_tests_pass
        run: cargo test --workspace
      - name: s021_t28_r28_core_has_no_logger
        # `core` emits no log line and depends on no logging crate (spec 021 R28).
        run: |
          deps="$(cargo tree -p privatechat-core -e normal --prefix none)"
          if printf '%s\n' "$deps" | grep -E '^(log|tracing[a-z_-]*|slog[a-z_-]*|env_logger|log4rs|fern) v'; then exit 1; fi
      - name: s010_t01_r01_sources_list_complete
        # The list of core sources the 010 T01 test reads is every tracked file; the script tests itself first.
        run: scripts/check_core_sources.sh
      - name: s020_t23_r23_io_in_one_module
        # Every system call of store in crates/store/src/fs.rs; the script tests itself first.
        run: scripts/check_store_io.sh
      - name: s030_t01_r01_deny_wrappers
        # `sha1` comes in only under `axum` and `tungstenite`, and `rand` only under `proptest`
        # and `tungstenite` (spec 030 R1); `cargo deny` checks the wrappers of every other path.
        # A crate cargo cannot name alone (two versions in the lock) fails the step.
        run: |
          direct() {
            local out
            if ! out="$(cargo tree -e normal,build --all-features --target all -i "$1" --depth 1 --prefix depth 2>&1)"; then
              case "$out" in *"did not match any packages"*) return 0 ;; esac
              printf '%s\n' "$out" >&2
              return 1
            fi
            printf '%s\n' "$out" | sed -n 's/^1\([a-z0-9_-]*\) .*/\1/p' | sort -u
          }
          sha1="$(direct sha1)" || exit 1
          rand="$(direct rand)" || exit 1
          bad="$( { printf '%s\n' "$sha1" | grep -vxE 'axum|tungstenite'; printf '%s\n' "$rand" | grep -vxE 'proptest|tungstenite'; } | grep -v '^$' || true)"
          if [ -n "$bad" ]; then echo "sha1 under: $sha1"; echo "rand under: $rand"; exit 1; fi
      - name: s032_t12_r12_no_copy
        # The server copies no blob: no backup, `VACUUM INTO`, `ATTACH`, serialisation,
        # extension, SQL trace or profile, in its code or as a feature of `rusqlite` (spec 032 R12).
        run: |
          if grep -rniE 'backup|VACUUM INTO|\.trace\(|\.profile\(|ATTACH|serialize|load_extension' crates/server/src; then exit 1; fi
          # `VACUUM` and `INTO` split over two lines or two literals.
          if grep -rzniE 'VACUUM[^A-Za-z0-9_]{1,20}INTO' crates/server/src; then exit 1; fi
          features="$(cargo tree -p privatechat-server -e features -i rusqlite --prefix none)"
          if printf '%s\n' "$features" | grep -E 'rusqlite feature "(backup|trace|hooks|preupdate_hook|session|serialize|load_extension)"'; then exit 1; fi
      - name: s020_t31_r31_golden_files_unchanged
        # The golden files of spec 020 are never regenerated (R31).
        run: cd crates/store/tests/golden/v1 && sha256sum -c SHA256SUMS
      - name: s015_t06_r06_reference_script
        # The reference script rewrites specs/vectors/; any difference from the commit fails.
        run: |
          python3 scripts/reference/vectors.py
          changed="$(git status --porcelain -- specs/vectors)"
          if [ -n "$changed" ]; then echo "$changed"; git diff -- specs/vectors; exit 1; fi

  store-macos:
    name: store-macos
    # The commit order and its crash points on a second file system (spec 020 R23).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: s020_t10_r10_commit_order_on_macos
        run: cargo test -p privatechat-store s020_t

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: s001_t03_r03_cargo_deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          # Without this, a changed build script is only a warning (spec 010 R16).
          command-arguments: -D checksum-mismatch

  doc-lint:
    name: doc-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: s001_t04_r04_doc_lint
        env:
          DOC_LINT_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: scripts/doc_lint.sh
      - name: s003_t08_r08_doc_lint_self_test
        run: python3 scripts/doc_lint_selftest.py
      - name: s000_t05_r05_inici_is_ignored
        run: scripts/check_layout.sh ignored
      - name: s000_t06_r06_root_files_exist
        run: scripts/check_layout.sh files

  check-requirements:
    name: check-requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: s001_t07_r07_every_requirement_has_a_test
        run: scripts/check_requirements.sh
      - name: s016_t12_r12_fuzz_targets_reached
        run: scripts/check_fuzz_targets.sh

  adr-guard:
    name: adr-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: s001_t08_r08_protected_paths_require_adr # also s002_t05_r05_format_changes_need_adr
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # No rename detection: a file moved out of a protected path is listed at
          # both ends. The module roots `crypto.rs`, `proto.rs` and `storage.rs` are
          # the modules themselves.
          changed="$(git diff --no-renames --name-only "$BASE"...HEAD)"
          protected="$(printf '%s\n' "$changed" | grep -E '^(crates/core/src/(proto|crypto|storage)(/|\.rs$)|crates/store/(src|tests/golden)/|specs/vectors/|specs/0(1[12347]|20|31)-)' || true)"
          if [ -z "$protected" ]; then echo "no protected paths touched"; exit 0; fi
          case ",$LABELS," in *,adr-not-needed,*) echo "label adr-not-needed present"; exit 0;; esac
          # A new ADR is an added file with a number the base does not have: a
          # renamed old ADR is neither.
          added_adr="$(git diff --name-only --diff-filter=A "$BASE"...HEAD | grep -E '^docs/adr/[0-9]{4}-[a-z0-9-]+\.md$' || true)"
          known="$(git ls-tree --name-only "$BASE" docs/adr/ | sed -n 's#^docs/adr/\([0-9]\{4\}\)-.*#\1#p')"
          added_adr="$(printf '%s\n' "$added_adr" | while read -r f; do
            [ -n "$f" ] || continue
            n="$(basename "$f" | cut -c1-4)"
            printf '%s\n' "$known" | grep -qx "$n" || echo "$f"
          done)"
          if [ -z "$added_adr" ]; then
            echo "Protected paths changed without a new ADR (AGENTS 3):"; echo "$protected"; exit 1
          fi
          echo "new ADR: $added_adr"

  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: s001_t09_r09_commit_subjects_have_prefix
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # `git log` on its own line, so that an unreachable BASE fails the step;
          # each subject behind a `>`, so that an empty one is a line too.
          subjects="$(git log --no-merges --format='>%s' "$BASE"..HEAD)"
          bad="$(printf '%s\n' "$subjects" | grep -Ev '^>([0-9]{3}|docs|ci|chore|adr): ' | grep -v '^$' || true)"
          if [ -n "$bad" ]; then
            echo "bad commit subjects:"; echo "$bad"; exit 1
          fi
