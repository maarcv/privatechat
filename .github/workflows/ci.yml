# Phase 0 CI (spec 001). Each job is a requirement of docs/spec.md §10 "CI per phase".
name: ci

# s001_t10_r10_triggers_and_permissions: push to main/mvp, every PR, read-only.
# A label added or removed reruns it too, since adr-guard reads the labels of the event, and
# so does `edited`, which a change of base branch fires.
on:
  push:
    branches: [main, mvp]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  # s001_t05_r05_concurrency_cancels_previous_runs: one run per branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# `bash` named explicitly runs every step with `-eo pipefail`: a failing command
# inside a pipe fails its step instead of being hidden by the last one.
defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # from rust-toolchain.toml (rustup ≥ 1.28 installs the pinned channel and components)
      - name: s001_t01_r01_fmt_check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # from rust-toolchain.toml (rustup ≥ 1.28 installs the pinned channel and components)
      - uses: Swatinem/rust-cache@v2 # s001_t06_r06_cargo_cache
      - name: s001_t02_r02_clippy_denies_warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: s016_t12_r12_clippy_under_cfg_fuzzing
        # `fuzz_entry` compiles only under `--cfg fuzzing` outside tests (spec 016).
        run: RUSTFLAGS="--cfg fuzzing" cargo clippy -p privatechat-core -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # from rust-toolchain.toml (rustup ≥ 1.28 installs the pinned channel and components)
      - uses: Swatinem/rust-cache@v2
      - name: s000_t01_r01_workspace_builds
        run: cargo build --workspace --all-targets
      - name: s000_t02_r02_workspace_tests_pass
        run: cargo test --workspace
      - name: s015_t06_r06_reference_script
        # The reference script rewrites specs/vectors/; any difference from the commit fails.
        run: |
          python3 scripts/reference/vectors.py
          changed="$(git status --porcelain -- specs/vectors)"
          if [ -n "$changed" ]; then echo "$changed"; git diff -- specs/vectors; exit 1; fi

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: s001_t03_r03_cargo_deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          # Without this, a changed build script is only a warning (spec 010 R16).
          command-arguments: -D checksum-mismatch

  doc-lint:
    name: doc-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: s001_t04_r04_doc_lint
        env:
          DOC_LINT_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: scripts/doc_lint.sh
      - name: s003_t08_r08_doc_lint_self_test
        run: python3 scripts/doc_lint_selftest.py
      - name: s000_t05_r05_inici_is_ignored
        run: scripts/check_layout.sh ignored
      - name: s000_t06_r06_root_files_exist
        run: scripts/check_layout.sh files

  check-requirements:
    name: check-requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: s001_t07_r07_every_requirement_has_a_test
        run: scripts/check_requirements.sh
      - name: s016_t12_r12_fuzz_targets_reached
        run: scripts/check_fuzz_targets.sh

  adr-guard:
    name: adr-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: s001_t08_r08_protected_paths_require_adr # also s002_t05_r05_format_changes_need_adr
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # No rename detection: a file moved out of a protected path is listed at
          # both ends. The module roots `crypto.rs`, `proto.rs` and `storage.rs` are
          # the modules themselves.
          changed="$(git diff --no-renames --name-only "$BASE"...HEAD)"
          protected="$(printf '%s\n' "$changed" | grep -E '^(crates/core/src/(proto|crypto|storage)(/|\.rs$)|crates/store/(src|tests/golden)/|specs/vectors/|specs/0(1[12347]|20|31)-)' || true)"
          if [ -z "$protected" ]; then echo "no protected paths touched"; exit 0; fi
          case ",$LABELS," in *,adr-not-needed,*) echo "label adr-not-needed present"; exit 0;; esac
          # A new ADR is an added file with a number the base does not have: a
          # renamed old ADR is neither.
          added_adr="$(git diff --name-only --diff-filter=A "$BASE"...HEAD | grep -E '^docs/adr/[0-9]{4}-[a-z0-9-]+\.md$' || true)"
          known="$(git ls-tree --name-only "$BASE" docs/adr/ | sed -n 's#^docs/adr/\([0-9]\{4\}\)-.*#\1#p')"
          added_adr="$(printf '%s\n' "$added_adr" | while read -r f; do
            [ -n "$f" ] || continue
            n="$(basename "$f" | cut -c1-4)"
            printf '%s\n' "$known" | grep -qx "$n" || echo "$f"
          done)"
          if [ -z "$added_adr" ]; then
            echo "Protected paths changed without a new ADR (AGENTS 3):"; echo "$protected"; exit 1
          fi
          echo "new ADR: $added_adr"

  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: s001_t09_r09_commit_subjects_have_prefix
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # `git log` on its own line, so that an unreachable BASE fails the step;
          # each subject behind a `>`, so that an empty one is a line too.
          subjects="$(git log --no-merges --format='>%s' "$BASE"..HEAD)"
          bad="$(printf '%s\n' "$subjects" | grep -Ev '^>([0-9]{3}|docs|ci|chore|adr): ' | grep -v '^$' || true)"
          if [ -n "$bad" ]; then
            echo "bad commit subjects:"; echo "$bad"; exit 1
          fi
