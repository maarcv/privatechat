[package]
name = "privatechat-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Local client storage: encrypted files with atomic commit (ADR 0021)."

[lib]
name = "privatechat_store"
path = "src/lib.rs"

[dependencies]
# The only dependency of `store` (spec 020-store-files): every byte it encrypts or
# encodes goes through `core`. A version as well as the path, so `cargo deny`
# does not take it for a wildcard.
privatechat-core = { path = "../core", version = "0.0.0" }

[dev-dependencies]
# The doubles and builders of `core::testing`, for the tests only (spec 020).
privatechat-core = { path = "../core", version = "0.0.0", features = ["test-support"] }
# The random choices of the phase 2 exit test, drawn by a proptest of one case
# (spec 027-core-api R23), as `core` draws its round trips; a test dependency only.
proptest = "1.8.0"

[lints]
workspace = true
