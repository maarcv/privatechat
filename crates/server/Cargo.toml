[package]
name = "privatechat-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Blind mailbox with TTL: relays opaque blobs per channel over WebSocket (docs/spec.md §6)."

[lib]
name = "privatechat_server"
path = "src/lib.rs"

[[bin]]
name = "privatechat-server"
path = "src/main.rs"

[dependencies]
# `relay` and `Frame` are the server's only contact with the protocol (AGENTS 2).
# A version as well as the path, so `cargo deny` does not take it for a wildcard.
privatechat-core = { path = "../core", version = "0.0.0" }
# The blob table (spec 032-storage-ttl, docs/spec.md §6 "Storage"). `bundled`
# compiles the SQLite the crate ships, so every host runs the same engine; the
# default features (a statement cache and a WebAssembly build) are not needed.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# One task per connection, the deadline task and the listeners (spec
# 030-ws-protocol), the backlog reads on the blocking pool (spec 032-storage-ttl
# R9) and `Writer::finish`'s oneshot.
tokio = { version = "1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
# The HTTP route and the WebSocket upgrade (spec 030 R3); HTTP/1 only, no
# default feature (no tracing, no JSON, no form).
axum = { version = "0.8.9", default-features = false, features = ["ws", "http1", "tokio"] }
# Only to recognise `Error::Capacity` behind `axum::Error` and close with 1009
# (spec 030 R4), at the version axum pins: 0.30 would bring `rand` 0.10, and
# with it the banned `chacha20`.
tungstenite = { version = "0.29.0", default-features = false }

[features]
# `ManualClock` and the test hooks, for the integration tests of spec
# 035-server-ops; off in every shipped build (spec 035 R10).
test-support = []

[dev-dependencies]
# The test client over a real socket (spec 030), at the version axum pins.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
# `SinkExt` and `StreamExt` for that client.
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
# `testing::subscribe_credential`, so that the tests sign what a client signs
# (spec 031-auth-channel-signature); the server itself holds no key.
privatechat-core = { path = "../core", version = "0.0.0", features = ["test-support"] }

[lints]
workspace = true
