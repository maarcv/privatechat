[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/server"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/maarcv/privatechat"
rust-version = "1.98"

# Shared lints: each crate opts in with `[lints] workspace = true`.
# This is the single source of the list (docs/spec.md §10, AGENTS.md rule 4).
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny" # `forbid` in store and server; `deny` in core, `allow` only in crates/core/src/crypto/ffi.rs (AGENTS 12).

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
overflow-checks = true
