[workspace]
resolver = "2"
members = ["core", "store", "server"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/maarcv/privatechat"
rust-version = "1.98"

# Lints compartits: cada crate els activa amb `[lints] workspace = true`.
# La llista és la de docs/spec.md §10 «Definició de fet» i AGENTS.md regla 4.
[workspace.lints.rust]
unsafe_code = "deny"          # `forbid` als crates; `allow` només a core/src/crypto/ffi.rs (AGENTS 12)
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
overflow-checks = true
