# `core` does no I/O and never reads the clock: time comes in as a parameter
# (AGENTS 10, spec 010 R17). The `store` and `server` crates do their I/O at a
# single audited place, which allows the lint there with a reason.
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "time is a parameter (AGENTS 10)" },
  { path = "std::time::Instant::now", reason = "time is a parameter (AGENTS 10)" },
  { path = "std::thread::sleep", reason = "no clock in core (AGENTS 10)" },
  { path = "std::fs::read", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::fs::write", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::fs::File::open", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::fs::File::create", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::net::TcpStream::connect", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::time::SystemTime::elapsed", reason = "time is a parameter (AGENTS 10)" },
  { path = "std::time::Instant::elapsed", reason = "time is a parameter (AGENTS 10)" },
  { path = "std::fs::read_to_string", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::fs::read_dir", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::fs::create_dir_all", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::fs::remove_file", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::fs::rename", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::fs::File::options", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::fs::OpenOptions::open", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::net::TcpListener::bind", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::net::UdpSocket::bind", reason = "core does no I/O (AGENTS 10)" },
  { path = "std::env::var", reason = "core reads no environment (AGENTS 10)" },
]
